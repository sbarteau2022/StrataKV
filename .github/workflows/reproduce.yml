name: StrataKV Deterministic Silicon & Adversarial Reproduction

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  reproduce-and-benchmark:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout StrataKV Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest numpy
          if [ "${{ runner.os }}" = "macOS" ]; then
            pip install mlx || echo "MLX installation optional on macOS CI runner"
          fi

      - name: Run Deterministic 40-Turn Baseline Suite
        run: |
          chmod +x reproduce.sh
          ./reproduce.sh

      - name: Run Adversarial Pressure Suite (100, 500, 750 Steps)
        run: |
          python benchmarks/run_adversarial_pressure_test.py

      - name: Archive Benchmark Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: benchmarks/*.json
