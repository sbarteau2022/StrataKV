[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stratakv"
version = "1.0.0"
description = "StrataKV: The 3-Tier Breathing KV Cache for Apple Silicon and Autonomous Agent Architectures"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Stewart Barteau", email = "stewart@ethicalintelligence.org" }]
keywords = ["kv-cache", "apple-silicon", "mlx", "metal", "transformers", "agentic-ai", "context-compression"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.30.0"]
test = ["pytest>=7.0.0"]

[project.urls]
Homepage = "https://github.com/sbarteau2022/stratakv"
Repository = "https://github.com/sbarteau2022/stratakv.git"
